apiVersion: v1
kind: Service
metadata:
  labels:
    app: coredns
  name: coredns
spec:
  type: LoadBalancer
  selector:
    app: coredns
  ports:
    - name: udp-53-53
      port: 53
      protocol: UDP
      targetPort: 53
    - name: tcp-53-53
      port: 53
      protocol: TCP
      targetPort: 53
status:
  loadBalancer: {}
