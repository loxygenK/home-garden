apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: iridescence
  name: iridescence
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: iridescence
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: iridescence
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: iridescence-configuration
        image: ghcr.io/pastel-biota/iridescence-public:v2.0.5
        imagePullPolicy: Always
        name: iridescence
        ports:
        - containerPort: 3000
          protocol: TCP
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: docker-ghcr-creds
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
