apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: soil
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/loxygenK/home-garden
        revision: main
        files:
          - path: apps/*/pot.yml
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        notifications.argoproj.io/subscribe.on-discord-sync-succeeded.discord: ""
        notifications.argoproj.io/subscribe.on-discord-sync-failed.discord: ""
    spec:
      project: default
      source:
        repoURL: https://github.com/loxygenK/home-garden
        targetRevision: main
        path: '{{.path.path}}/manifest'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
